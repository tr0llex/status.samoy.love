name: Deploy

# Три независимые цели: страница, агент, который собирает для неё данные, и
# бот, который эти данные пересказывает в Telegram. Разделены сознательно —
# правка страницы не должна перезапускать сбор метрик, обновление агента не
# должно ждать пересборки статики, а перезапуск бота не должен задевать ни то,
# ни другое.

# ДВА СЛОЯ ОТБОРА, И ОНИ ОБЯЗАНЫ БЫТЬ СОГЛАСОВАНЫ.
#
# Первый — paths-ignore ниже: решает, БУДЕТ ЛИ ЗАПУСК вообще. Правка одной
# документации не должна порождать даже пустого прогона.
# Второй — задача `changes`: решает, КАКАЯ ИЗ ТРЁХ ЦЕЛЕЙ поедет. Правка одного
# сервиса не должна катить два других.
#
# Отсюда правило, которое легко нарушить незаметно: НАБОР ПУТЕЙ, ДОХОДЯЩИХ ДО
# ТРИГГЕРА, ОБЯЗАН БЫТЬ НАДМНОЖЕСТВОМ ТОГО, ЧТО РАЗБИРАЕТ `changes`. Путь,
# погашенный здесь, до второго слоя не доедет никогда, и сколько бы правильно
# он там ни разбирался — выкатки не будет, а красного тоже не будет.
#
# Поэтому гасим только то, что заведомо не может быть путём сервиса:
#   *.md      — README и CLAUDE.md, но ТОЛЬКО В КОРНЕ. Прежнее '**.md' гасило
#               markdown на любой глубине, включая src/: страница собирается
#               Astro, а он рендерит .md как обычные страницы — и первая же
#               страница, написанная markdown'ом, молча перестала бы
#               выкатываться. Гапа сегодня нет только потому, что таких файлов
#               пока не завели; условие «пока не завели» — не условие.
#   docs/**   — весь остальной текст, вместе с картинками к нему: docs/img
#               не .md, и раньше правка схемы давала пустой зелёный прогон.
#   data/**   — выдача агента, она приезжает на сервер сама, а не выкаткой.
#
# Дальше — то, что не является путём сервиса по другой причине: оно относится
# к проверкам, а не к проду. Ни один из этих путей не попадает НИ В ОДИН
# BUILD_CMD (.deploy-kit/*.env) и не разбирается в `changes`, поэтому прогон
# по ним и раньше заканчивался зелёным, не выкатив ничего:
#   ci.yml, coverage.yml, probe.yml, dependabot.yml
#             — сами проверки. Перечислены ПОИМЁННО, а не '.github/**':
#               deploy.yml обязан катить всё (он в `changes`), а новый
#               workflow пусть по умолчанию заводит прогон, а не молчит.
#   e2e/**, playwright*.config.ts
#             — сквозные проверки. Смоук по проду живёт в этом же файле, но
#               запускается только вслед за успешной выкаткой site или agent,
#               а правка одних тестов ни одной выкатки не делает — то есть
#               и до этого не запускался.
#   codecov.yml, .githooks/**, LICENSE
#             — покрытие, локальный хук и лицензия.
# Списки сверены построчно: ни один путь отсюда не встречается в `changes`.
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/coverage.yml'
      - '.github/workflows/probe.yml'
      - '.github/dependabot.yml'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'playwright.prod.config.ts'
      - 'codecov.yml'
      - '.githooks/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      target:
        description: 'Что катим'
        type: choice
        options: [all, site, agent, bot]
        default: all
      dry-run:
        type: boolean
        default: false

# Минимальные права для GITHUB_TOKEN. Выкатка ходит на сервер по SSH
# секретами, токен ей нужен только для checkout.
#
# deployments: write — ради связи «коммит → выкатка». Переиспользуемый workflow
# заводит Deployment на тот же SHA, и запись видна прямо на коммите и в панели
# Environments репозитория: по коммиту становится видно, уехал он или нет.
# Права ВЫЗЫВАЮЩЕГО здесь потолок: вызываемый workflow не может получить
# больше, чем выдано тут, поэтому строчка нужна с обеих сторон. Половинки
# могут приехать в любом порядке — сама запись необязательна и её отсутствие
# не роняет выкатку.
permissions:
  contents: read
  deployments: write

jobs:
  # Что вообще менялось.
  #
  # Раньше любой пуш катил все три цели, и в Telegram приходило «бот выкачен»
  # после правки, которая бота не касалась. Лишняя выкатка — это не только
  # шум: каждая из них перезапускает службу и обнуляет аптайм на ровном месте.
  #
  # Общие файлы (конфиг проверок, .deploy-kit, сам workflow) намеренно
  # затрагивают всех: от них зависит поведение каждой цели.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site: ${{ steps.f.outputs.site }}
      agent: ${{ steps.f.outputs.agent }}
      bot: ${{ steps.f.outputs.bot }}
    steps:
      # Вся история, а не два коммита: диапазон считается от предыдущей
      # вершины main (см. ниже), и при глубине 2 её объекта в клоне не было бы.
      # Репозиторий маленький, полный клон стоит секунды.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: f
        env:
          # Предыдущая вершина ветки по данным самого события. Через env, а не
          # подстановкой в тело скрипта: значение приходит извне и в теле
          # команды ему делать нечего.
          BEFORE: ${{ github.event.before }}
        run: |
          # На ручном запуске выбор делает человек — считаем, что менялось всё.
          if [ "${{ github.event_name }}" != "push" ]; then
            printf 'site=true\nagent=true\nbot=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ДИАПАЗОН — ОТ ПРЕДЫДУЩЕЙ ВЕРШИНЫ, А НЕ ОТ HEAD^.
          #
          # Сквош-мерж кладёт в main ровно один коммит, и на нём разницы нет.
          # Но пуш из нескольких коммитов — не запрещённая экзотика (хотфикс,
          # ревертнутая пачка), а при нём HEAD^ показывает только ПОСЛЕДНИЙ:
          # правка агента, приехавшая первым коммитом той же пачки, исчезала
          # из отбора, и агент не выкатывался. Это ровно то тихое
          # недосрабатывание, от которого заведён весь этот отбор.
          #
          # Форс-пуш делает BEFORE недостижимым, а первый пуш ветки — нулями.
          # Оба случая падают обратно на HEAD^: хуже прежнего не станет.
          BASE="$BEFORE"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=HEAD^
          fi
          echo "диапазон: $BASE..HEAD"

          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "изменилось:"; echo "$FILES" | sed 's/^/  /'

          common='^(config/|\.deploy-kit/|\.github/workflows/deploy\.yml|package(-lock)?\.json)'
          if echo "$FILES" | grep -qE "$common"; then
            echo 'общие файлы — катим все цели'
            printf 'site=true\nagent=true\nbot=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # deploy/ — не общий каталог: юнит агента и юнит с verify бота едут
          # внутрь артефакта соответствующей цели (см. BUILD_CMD в
          # .deploy-kit/agent.env и bot.env), поэтому каждый файл подтягивает
          # свою цель, а не обе. Без этих путей пуш, правящий только юнит,
          # проходил зелёным и не выкатывал ничего: файл в git расходился с
          # файлом на машине молча — ровно от этого расхождения юниты когда-то
          # и переехали в артефакт.
          # Новый файл в deploy/ ничего не сломает: чтобы он куда-то поехал,
          # его всё равно надо вписать в BUILD_CMD, а .deploy-kit/ — общий и
          # катит все цели.
          # scripts/ — тоже вход сборки страницы, а не оснастка рядом с ней:
          # astro.config.mjs импортирует оттуда events-dev-endpoint.mjs и
          # ставит его плагином vite, а check:no-inline-scripts из гейта — это
          # scripts/check-no-inline-scripts.mjs. Правка любого из двух меняет
          # результат `npm run build` или гейта, но страницу не выкатывала.
          echo "$FILES" | grep -qE '^(src/|public/|scripts/|astro\.config|tsconfig)' && S=true || S=false
          echo "$FILES" | grep -qE '^(agent/|deploy/systemd/status-agent\.)' && A=true || A=false
          echo "$FILES" | grep -qE '^(bot/|deploy/systemd/samoylove-bot\.|deploy/verify-bot\.sh)' && B=true || B=false
          printf 'site=%s\nagent=%s\nbot=%s\n' "$S" "$A" "$B" >> "$GITHUB_OUTPUT"

  site:
    needs: changes
    # На push инпутов нет — смотрим, что менялось; на ручном выбирают цель.
    if: >-
      (inputs.target == '' && needs.changes.outputs.site == 'true')
      || inputs.target == 'all' || inputs.target == 'site'
    uses: samoy-love/deploy-kit/.github/workflows/static-site.yml@main
    with:
      config: .deploy-kit/site.env
      # nginx-conf не передаём: с «Чистки» (5908166) конфиг живёт в самом
      # deploy-kit, а не в этом репозитории. Ссылка на удалённый файл роняла
      # выкатку страницы на шаге проверки конфига.
      # check:no-inline-scripts — часть гейта, а не украшение: CSP на проде
      # отдаёт script-src 'self', и вернувшийся инлайн-скрипт не выполнится.
      gates: npm ci && npm run build && npm run check:no-inline-scripts
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  agent:
    needs: changes
    if: >-
      (inputs.target == '' && needs.changes.outputs.agent == 'true')
      || inputs.target == 'all' || inputs.target == 'agent'
    uses: samoy-love/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/agent.env
      workdir: agent
      # Полный `go test ./... -race` с покрытием сюда не входит: тот же
      # прогон уже прошёл в ci.yml на этом дереве — pull_request считает
      # проверки на результате слияния с main (см. комментарий у триггера
      # ci.yml), так что коммит, доехавший до main, уже проверен. Гонять
      # тесты второй раз на каждый мерж — не надёжность, а то же ожидание
      # ещё раз, причём перед самым переключением прода. Здесь остаётся
      # дешёвая проверка, что дерево собирается: секунды, не минуты.
      gates: go vet ./... && go build ./...
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  bot:
    # Агент и бот едут одним и тем же go-service.yml, а у него группа
    # concurrency общая на репозиторий. Запущенные одновременно, они попадают
    # в одну очередь, и ожидающий отменяется — бот стабильно падал за 0 секунд,
    # ничего не выкатив. Поэтому он ждёт агента, а не стартует параллельно.
    needs: [changes, agent]
    if: >-
      !cancelled()
      && (needs.agent.result == 'success' || needs.agent.result == 'skipped')
      && ((inputs.target == '' && needs.changes.outputs.bot == 'true')
          || inputs.target == 'all' || inputs.target == 'bot')
    uses: samoy-love/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/bot.env
      workdir: bot
      # Полный `go test ./... -race` с покрытием сюда не входит: тот же
      # прогон уже прошёл в ci.yml на этом дереве — pull_request считает
      # проверки на результате слияния с main (см. комментарий у триггера
      # ci.yml), так что коммит, доехавший до main, уже проверен. Гонять
      # тесты второй раз на каждый мерж — не надёжность, а то же ожидание
      # ещё раз, причём перед самым переключением прода. Здесь остаётся
      # дешёвая проверка, что дерево собирается: секунды, не минуты.
      gates: go vet ./... && go build ./...
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  # Смоук по живому проду.
  #
  # Проверка внутри выкатки смотрит на код ответа, а статус-страница отдаёт 200
  # и когда данных нет, и когда скрипт упал на неожиданном поле, — на экране
  # при этом пусто. Набор существовал давно и не запускался нигде: сегодня,
  # запущенный впервые, он сразу нашёл, что CSP блокирует SDK Telegram и
  # мини-приложение живёт без темы и кнопки «назад».
  #
  # Отдельной работой, а не гейтом внутри выкатки: гейт задержал бы
  # переключение, а проверять надо именно то, что уже переключилось. Красный
  # смоук — сигнал откатывать руками, `dk rollback status-site`.
  smoke:
    needs: [site, agent]
    if: >-
      !cancelled() && inputs.dry-run != true
      && (needs.site.result == 'success' || needs.agent.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Версия Playwright
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Поставить Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Системные библиотеки для Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        # Прогон #30832396073 (13 минут вместо обычных 2m35s-3m36s) встал
        # именно на этом шаге: apt через install-deps провисел 10 минут на
        # медленном зеркале. Короткий таймаут роняет такое зависание быстро,
        # а не съедает лимит джобы целиком.
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # Агент обходит сервисы раз в минуту: сразу после выкатки данные могут
      # быть от предыдущего запуска, и проверка свежести придирется на пустом
      # месте. Ждём один обход.
      - name: Дать агенту сделать обход
        run: sleep 75

      - run: npm run e2e:prod

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-report
          path: test-results/
          retention-days: 7

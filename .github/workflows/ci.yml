name: CI

on:
  # ТОЛЬКО pull_request. Раньше здесь был ещё push во все ветки, кроме main, и
  # каждый джоб выполнялся ДВАЖДЫ: один раз на пуш ветки, второй — на тот же
  # коммит в PR. Это не удвоенная надёжность, а удвоенное время и деньги: в
  # metro-map сквозные тесты идут минутами, и половина этих минут уходила в
  # прогон, результат которого никто не читает.
  #
  # Гейт — мерж, а мерж идёт через PR, поэтому проверять нужно ровно то, что
  # мержится: pull_request считает проверки на результате слияния с main, а не
  # на голой ветке. Ветка без PR остаётся непроверенной сознательно — её и не
  # во что мержить.
  pull_request:
  # Для ветки без PR: запустить руками, если понадобилось.
  workflow_dispatch:

# Минимальные права для GITHUB_TOKEN: CI только читает код. Без этого блока
# действуют настройки репозитория, и любой шаг (включая сторонние actions)
# получает тот токен, который там выставлен.
permissions:
  contents: read

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в тридцать семь коммитов подряд, и убирать его пришлось переписыванием
  # опубликованной истории. Локальный хук (.githooks/commit-msg) ловит это
  # раньше, но он включается вручную и в клоне отсутствует — здесь страховка.
  commits:
    name: Коммиты без упоминаний ИИ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          # Событие всегда pull_request (см. блок on:), поэтому диапазон один:
          # то, что ветка добавляет к своей базе.
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  agent:
    name: Агент (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          # go.sum в agent/ нет — оба модуля обходятся стандартной
          # библиотекой, без внешних зависимостей. cache-dependency-path на
          # go.sum не резолвился ни в один файл, и actions/setup-go молча
          # переставал кэшировать (warning "Some specified paths were not
          # resolved" в логе). go.mod существует всегда, поэтому ключ кэша
          # считаем по нему.
          cache-dependency-path: agent/go.mod

      - name: go vet
        working-directory: agent
        run: go vet ./...

      - name: golangci-lint
        # Приколот к SHA, а не к тегу: тег v9 мутабелен.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: agent

      - name: Тесты
        working-directory: agent
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: agent/coverage.out
          flags: agent
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  bot:
    name: Бот (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bot/go.mod
          # См. комментарий у джобы agent: go.sum в bot/ тоже нет.
          cache-dependency-path: bot/go.mod

      - name: go vet
        working-directory: bot
        run: go vet ./...

      - name: golangci-lint
        # Приколот к SHA, а не к тегу: тег v9 мутабелен.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: bot

      - name: Тесты
        working-directory: bot
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: bot/coverage.out
          flags: bot
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  page:
    name: Страница
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Линтеры идут до сборки: они падают за секунды, сборка — дольше.
      - name: ESLint
        run: npm run lint
      - name: Формат
        run: npm run format:check
      - name: Типы и шаблоны
        run: npm run check

      - run: npm run build

      # CSP на проде отдаёт script-src 'self' — без 'unsafe-inline'. Инлайн,
      # вернувшийся в сборку, не выполнится, и сломается это МОЛЧА уже после
      # выкатки. Поэтому проверка стоит здесь, а не в чьей-то голове.
      - name: В сборке нет инлайн-скриптов
        run: npm run check:no-inline-scripts

      # Конфиг читают и агент, и внешний сторож — синтаксическая ошибка
      # в нём ломает обоих разом.
      - name: Проверить конфиг проверок
        run: node -e "const c=require('./config/status.json'); if(!c.projects?.length) throw new Error('в конфиге нет проектов'); for(const p of c.projects){ if(!p.checks?.length) throw new Error('у проекта '+p.id+' нет проверок'); }"

  # Правила оценки написаны дважды — в агенте и в стороже. Так задумано:
  # внешняя проверка не должна зависеть от того же кода и той же машины.
  # Плата — расхождение, которое ничем не ловилось: bodyIncludes однажды уже
  # появился только у сторожа, и заметить это можно было лишь глазами.
  conformance:
    name: Агент и сторож судят одинаково
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm run conformance

  e2e:
    name: Сквозные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Проверка после выкатки смотрит на код ответа. Статус-страница отдаёт 200
    # даже когда данных нет, скрипт упал на неожиданном поле и на экране пусто.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Кэшируем ровно ту версию браузера, что просит установленный Playwright:
      # иначе после обновления пакета в кэше останется несовместимый бинарник.
      - name: Версия Playwright
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # Ставим только Chromium — прогон идёт в нём одном, остальные браузеры
      # это лишние сотни мегабайт на каждый PR.
      - name: Поставить Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Системные библиотеки для Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        # apt через npx playwright install-deps обычно укладывается в
        # секунды, но однажды завис на медленном зеркале и растянул весь
        # прогон до 26 минут вместо обычных 2-4. Короткий таймаут роняет
        # такое зависание быстро, а не съедает лимит джобы целиком.
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # Конфиг сам собирает страницу и поднимает preview. Данные проверок
      # подменяются наборами из e2e/fixtures — живой summary.json тут не нужен.
      - run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Переименование или слияние задачи выше не ломает сам прогон — он остаётся
  # зелёным, — а ломает защиту ветки: она хранит СТАРЫЕ имена, ждёт их вечно,
  # и PR не мержится без единого красного шага, объясняющего причину. Поломка
  # отложенная: видно её не в момент переименования, а на следующем PR, когда
  # «Merge» неактивен без объяснения. Эта задача сверяет фактические имена
  # задач текущего прогона (через GitHub Jobs API) со списком
  # required_status_checks.contexts ветки main и падает при расхождении в
  # любую сторону — пропавшая проверка или новая незащищённая.
  protection-sync:
    name: Защита ветки соответствует задачам CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # needs — не про очерёдность результата, а про то, что видит Jobs API.
    # GitHub регистрирует задачу с зависимостями в API прогона только когда
    # её needs выполнены и она реально стартовала — без needs эта задача
    # финиширует за секунды и застаёт API в момент, когда остальные задачи
    # ещё не созданы, а не пропущены. Итог — те же ложные "пропала проверка",
    # от которых задача должна защищать.
    needs:
      - commits
      - agent
      - bot
      - page
      - conformance
      - e2e
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Сверить задачи с обязательными проверками main
        env:
          # GITHUB_TOKEN не годится: у него нет права "administration",
          # которым читается защита ветки. Нужен fine-grained PAT с
          # Administration:Read-only + Actions:Read-only.
          GH_TOKEN: ${{ secrets.PROTECTION_READ_TOKEN }}
          # Эта задача не может требовать защиты самой себя на первом
          # прогоне — защита её ещё не видела. Имя вычитается из «лишних».
          SELF_JOB_NAME: Защита ветки соответствует задачам CI
        run: bash ci/branch-protection-check.sh

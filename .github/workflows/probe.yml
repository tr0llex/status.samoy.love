name: probe

# Обход сервисов снаружи. Репозиторий публичный, поэтому минуты не тратятся
# из лимита.
#
# СКОЛЬКО ЭТО НА САМОМ ДЕЛЕ РАЗ В ЧАС. Расписание ниже просит запуск каждые
# пять минут — минимальный интервал, который cron у GitHub вообще принимает.
# Принимает он его молча, а выполняет как получится: под нагрузкой запуски
# пропускаются пачками. Замер за сутки, промежутки между настоящими запусками:
#
#   3.5 ч · 2 ч 20 м · 3 ч 30 м · 3 ч 40 м · 1 ч 40 м · 1 ч · 1 ч · 1 ч · 1 ч
#
# То есть сервисы осматриваются снаружи примерно раз в час-два, а не двенадцать
# раз в час. Здесь это записано ровно затем, чтобы «проверки каждые пять минут»
# больше нигде не появилось: обещание, которого исполнитель не давал, хуже
# честного «когда получится» — по нему считают пороги и верят пустым промежуткам
# в истории.
#
# Расписание при этом остаётся частым НАМЕРЕННО: чем чаще просишь, тем чаще
# GitHub всё-таки запускает. Реже просить — значит получить ещё реже.
#
# Важно: проверки идут ИЗ GitHub, а не с сервера samoy.love. Если хост лежит,
# этот workflow продолжает работать и зафиксирует падение — ради этого всё и затевалось.
#
# Секреты (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN  — токен бота от @BotFather
#   TELEGRAM_CHAT_ID    — куда слать (свой id можно узнать у @userinfobot)
# Без них пробер работает молча, только пишет данные.

on:
  schedule:
    # Просьба, а не расписание: см. замеренные промежутки в шапке файла.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      notify_test:
        description: 'Прислать текущий статус в Telegram (проверка канала)'
        type: boolean
        default: false

# Две одновременные проверки подрались бы за push в data/.
concurrency:
  group: probe
  cancel-in-progress: false

# Самый широкий токен в проекте: запись нужна по делу — обход сохраняет
# результат коммитом в ветку status-data. Сузить право нельзя, поэтому сужено
# ВРЕМЯ его доступности: см. persist-credentials ниже.
permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false — токен НЕ остаётся в .git/config на весь
      # job. Между checkout и push здесь выполняется scripts/probe.mjs, который
      # ходит по внешним адресам из config/status.json; всё это время
      # write-токен лежал в рабочем каталоге и доставался любому коду, который
      # там запускается. Теперь он появляется только в шаге push, явной строкой.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Прошлое состояние лежит на отдельной ветке: main защищён, и пробер
      # не должен писать в него на каждом запуске. Без этого шага каждый
      # запуск начинал бы историю заново и считал любой сбой первым.
      - name: Забрать прошлое состояние
        run: |
          if git fetch origin status-data --depth=1 2>/dev/null; then
            git checkout origin/status-data -- data
          else
            echo 'ветки данных ещё нет — первый запуск'
          fi

      # СКОЛЬКО СТОРОЖА НЕ БЫЛО. Считается ДО обхода, пока data/state.json —
      # это ещё прошлый запуск, и попадает в три места сразу: в сводку прогона,
      # в сообщение коммита с данными и (при слишком долгом перерыве) в
      # предупреждение.
      #
      # Иначе разница между обещанной частотой и настоящей не видна нигде.
      # Данные в ветке выглядят одинаково и через пять минут, и через три часа:
      # в них написано, когда обход БЫЛ, но не когда его НЕ БЫЛО. Теперь на
      # второй вопрос отвечают и сводка прогона, и коммит с данными.
      #
      # Само сообщение в Telegram шлёт probe.mjs (PROBE_ABSENT_MS): здесь
      # только то, что видно в GitHub.
      - name: Возраст прошлого обхода
        id: age
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          let prev = null;
          try {
            const st = JSON.parse(fs.readFileSync('data/state.json', 'utf8'));
            if (typeof st.updated === 'string') prev = st.updated;
          } catch {
            // Ветки данных ещё нет или файл не читается — это первый обход.
          }
          const ms = prev ? Date.now() - Date.parse(prev) : NaN;
          const human = (v) => {
            const m = Math.round(v / 60000);
            return m < 60 ? `${m} мин` : `${Math.floor(m / 60)} ч ${m % 60} мин`;
          };
          const since = Number.isFinite(ms)
            ? `прошлый обход ${human(ms)} назад`
            : 'прошлых обходов нет';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `since=${since}\n`);
          // Те же два числа, но машинно: их забирает probe.mjs и кладёт в
          // сводку. Сам он этот промежуток посчитать не может — обходов в
          // запуске пять, и каждый переписывает data/state.json, так что со
          // второго у него выходит минута сна, а не длина перерыва. Граница
          // запуска известна только здесь.
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `previous=${prev ?? ''}\ngap_ms=${Number.isFinite(ms) ? ms : ''}\n`,
          );
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `Внешняя проверка: ${since}. Расписание просит каждые 5 минут, ` +
              'GitHub выполняет его примерно раз в час-два.\n',
          );
          // Порог тот же, что у сообщения в Telegram (PROBE_ABSENT_MS): выше
          // любого промежутка, который наблюдался при работающем расписании.
          if (Number.isFinite(ms) && ms >= 6 * 3600e3) {
            console.log(`::warning::расписание не выполнялось: ${since}`);
          }
          JS

      # Пять обходов с минутным шагом вместо одного — единственная частота,
      # которой здесь можно управлять.
      #
      # Раньше тут было написано, что так «закрывается окно между запусками».
      # Это неправда: окно длится час-полтора, и пятью минутами его не закрыть.
      # Настоящих причин две, и обе остаются в силе.
      #
      # 1. Без них подтверждения состояния не бывает вовсе. Смене состояния
      #    сторож верит только после двух обходов подряд (CONFIRM_RUNS в
      #    probe.mjs) — иначе моргнувший сервис заводит инцидент. Один обход
      #    на запуск означал бы подтверждение через час, то есть никогда.
      # 2. Пять точек подряд отличают моргание от падения, а одна — нет.
      #
      # Данные пишутся каждым обходом, коммит — один в конце.
      - name: Обойти сервисы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_TEST: ${{ inputs.notify_test }}
          # Граница между запусками — единственное, чего обход не знает о себе
          # сам: все пять обходов запуска видят только соседа по циклу.
          PROBE_PREVIOUS_AT: ${{ steps.age.outputs.previous }}
          PROBE_GAP_MS: ${{ steps.age.outputs.gap_ms }}
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::обход $i из 5"
            # Один упавший обход не должен съедать остальные: сеть у раннера
            # тоже бывает мигающей, а данные важнее одной итерации.
            node scripts/probe.mjs || echo "::warning::обход $i завершился ошибкой"
            echo '::endgroup::'
            # Тест-сводка нужна ровно один раз, а не пять.
            NOTIFY_TEST=false
            export NOTIFY_TEST
            [ "$i" = 5 ] || sleep 60
          done

      - name: Сохранить результат
        env:
          # Токен доступен ровно этому шагу и ровно на время push'а —
          # см. persist-credentials в шаге checkout.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Через env, а не подстановкой в тело: значение считано из файла и
          # в командной строке ему делать нечего.
          SINCE: ${{ steps.age.outputs.since }}
        run: |
          git config user.name  'status-probe'
          git config user.email 'status-probe@users.noreply.github.com'
          git checkout -B status-data
          # -f: в main каталог данных под .gitignore, а здесь он и есть смысл ветки.
          git add -f data
          # Данные не изменились — коммитить нечего (бывает при полном совпадении
          # агрегатов), это нормальный исход, а не ошибка.
          if git diff --cached --quiet; then
            echo 'изменений нет'
            exit 0
          fi
          # Промежуток — в самом сообщении. Истории у ветки нет (ниже force-push
          # оставляет ровно один коммит), поэтому единственная строка, которая в
          # ней видна, обязана отвечать не только «когда обход был», но и
          # «сколько его перед этим не было».
          git commit -m "probe: $(date -u '+%Y-%m-%d %H:%M UTC') · $SINCE"
          # Ветка — приватная память пробера, история в ней не нужна:
          # force-push избавляет от гонок между запусками и от rebase-плясок.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-data

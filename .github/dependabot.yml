version: 2

# Обновления зависимостей раз в неделю, по понедельникам: реже — и копится
# пачка, которую разбирают залпом и потому невнимательно; чаще — и PR
# перестают читать вовсе.
#
# open-pull-requests-limit держит очередь короткой намеренно. Двадцать
# открытых PR от бота — это не двадцать обновлений, а ноль.
#
# groups: минорные и патчевые обновления каждой экосистемы едут одним PR.
# Поштучно их выходило до пяти в неделю на экосистему, и каждый мерж — это
# отдельная выкатка прода и отдельное сообщение в чат ради поднятой цифры в
# lock-файле. Мажорные остаются поштучно: они ломают, их читают по одному.
#
# Сообщения на русском в повелительном наклонении, как везде в этих
# репозиториях (CLAUDE.md). Префикс deps: отделяет машинные правки от
# человеческих.

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # TypeScript 7 не встаёт, пока его не поддержит typescript-eslint: тот
      # объявляет peer typescript ">=4.8.4 <6.1.0", и npm ci падает на
      # разрешении зависимостей ещё до компиляции. Это очередь обновлений, а
      # не наш код.
      #
      # СНЯТЬ, как только typescript-eslint объявит поддержку 7.x — вместе с
      # обновлением самого typescript-eslint, одним PR.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'gomod'
    directory: '/agent'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'gomod'
    directory: '/bot'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
